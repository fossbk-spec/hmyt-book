asuring hives (wheals) from skin photographs to support Urticaria management.\",\"link\":\"/en/du_an/may_day\"},{\"text\":\"2.2 Grading Diabetic Retinopathy (DR) severity from fundus photographs.\",\"link\":\"/en/du_an/day_mat\"},{\"text\":\"2.3 Automatic Cup-to-Disc Ratio (CDR) measurement from fundus images for glaucoma screening.\",\"link\":\"/en/du_an/glocom\"},{\"text\":\"2.4 Classifying Age-related Macular Degeneration (AMD) from fundus photographs.\",\"link\":\"/en/du_an/amd\"},{\"text\":\"2.5 Detecting Epiretinal Membrane (ERM) from fundus photographs or OCT.\",\"link\":\"/en/du_an/erm\"},{\"text\":\"2.6 (advanced — unified): Multi-label classification of several retinal diseases (DR, AMD, Glaucoma...) simultaneously with a SINGLE Edge AI model running fully offline on a mobile device — the closest simulation of the real engineering problem behind an AI-integrated portable fundus camera.\",\"link\":\"/en/du_an/edge_ai_da_benh_ly\"},{\"text\":\"2.7 Automated fundus Image Quality Assessment (IQA) — a quality gate before diagnosis.\",\"link\":\"/en/du_an/iqa_fundus\"},{\"text\":\"3.1 Personalizing the \\\"Four Pillars\\\" Heart Failure regimen for frail elderly patients.\",\"link\":\"/en/du_an/tu_tru_suy_tim\"},{\"text\":\"3.2 Handling missing cognitive-score data (MMSE/MoCA) in Dementia screening.\",\"link\":\"/en/du_an/sa_sut_tri_tue\"},{\"text\":\"3.3 Building a fall-risk and Anticholinergic Burden warning system (DDI-AI).\",\"link\":\"/en/du_an/te_nga_khang_cholinergic\"},{\"text\":\"3.4 Mortality/complication risk stratification for Heart Failure patients from tabular data (Tabular DxAI) — ACCELERATED version.\",\"link\":\"/en/du_an/suy_tim_risk_dxai\"},{\"text\":\"4.1 Automatically extracting Urticaria trigger context from free-text clinical history.\",\"link\":\"/en/du_an/may_day_nlp\"},{\"text\":\"4.2 Automatic ICD-10 code classification from hospital discharge summaries.\",\"link\":\"/en/du_an/phan_loai_icd10\"}]},{\"text\":\"📤 SUBMIT ASSIGNMENT\",\"co
